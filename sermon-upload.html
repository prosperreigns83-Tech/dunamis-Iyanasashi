<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Upload Sermon | Dunamis Church</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');

:root {
  --primary: #0a2a66;
  --secondary: #ffffff;
  --accent: #4da3ff;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}



body {
  background: var(--secondary);
  color: #222;
  line-height: 1.6;
}

/* NAVBAR */
header {
  background: var(--primary);
  padding: 15px 40px;
  position: sticky;
  top: 0;
  z-index: 1000;
}

.navbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  color: white;
  font-size: 24px;
  font-weight: 700;
}

.nav-links {
  display: flex;
  gap: 25px;
}

.nav-links a {
  color: white;
  text-decoration: none;
  font-weight: 500;
}

.menu-toggle {
  display: none;
  font-size: 26px;
  color: white;
  cursor: pointer;
}

/* HERO */
.hero {
  background: linear-gradient(rgba(10,42,102,0.8), rgba(10,42,102,0.8)),
              url('https://images.unsplash.com/photo-1529070538774-1843cb3265df') center/cover;
  color: white;
  padding: 120px 20px;
  text-align: center;
}

.hero h1 {
  font-size: 48px;
}

.hero p {
  margin: 15px 0;
  font-size: 18px;
}

.btn {
  background: var(--accent);
  color: white;
  padding: 12px 30px;
  border-radius: 5px;
  text-decoration: none;
  display: inline-block;
  margin-top: 20px;
}

/* SECTIONS */
section {
  padding: 60px 40px;
  max-width: 1100px;
  margin: auto;
}

section h2 {
  color: var(--primary);
  margin-bottom: 20px;
  text-align: center;
}

/* FOOTER */
footer {
  background: var(--primary);
  color: white;
  text-align: center;
  padding: 20px;
  margin-top: 50px;
}

/* RESPONSIVE */
@media (max-width: 768px) {
  .nav-links {
    display: none;
    flex-direction: column;
    background: var(--primary);
    position: absolute;
    top: 65px;
    right: 0;
    width: 100%;
    padding: 20px;
  }

  .nav-links.show {
    display: flex;
  }

  .menu-toggle {
    display: block;
  }

  .hero h1 {
    font-size: 34px;
  }
}
form {
  max-width: 500px;
  margin: auto;
}

form input, form select {
  width: 100%;
  padding: 12px;
  margin: 10px 0;
}

video, audio {
  margin-top: 10px;
}

  </style>
</head>
<body>

<header>
  <div class="navbar">
    <div class="logo">Dunamis</div>
    <div class="menu-toggle">☰</div>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="./sermons.html">Sermons</a>
    
    
    </nav>
  </div>>
    </nav>
  </div>
</header>

<section>
  <h2>Upload Pastor Message</h2>

  <form id="uploadForm">
    <input type="text" id="title" placeholder="Sermon Title" required>

    <select id="type" required>
      <option value="">Select Type</option>
      <option value="video">Video Sermon</option>
      <option value="audio">Audio Sermon</option>
    </select>

    <input type="file" id="file" accept="audio/*,video/*" required>

    <button type="submit">Upload Sermon</button>
  </form>
</section>

<script>
  let sermons = JSON.parse(localStorage.getItem("sermons")) || [];

// UPLOAD SERMON
const uploadForm = document.getElementById("uploadForm");

if (uploadForm) {
  uploadForm.addEventListener("submit", function (e) {
    e.preventDefault();

    const title = document.getElementById("title").value;
    const type = document.getElementById("type").value;
    const fileInput = document.getElementById("file");

    const file = fileInput.files[0];
    const url = URL.createObjectURL(file);

    sermons.push({ title, type, url });
    localStorage.setItem("sermons", JSON.stringify(sermons));

    alert("Sermon uploaded successfully!");
    uploadForm.reset();
  });
}

// DISPLAY SERMONS
const sermonList = document.getElementById("sermonList");

if (sermonList) {
  sermons.forEach((sermon) => {
    const div = document.createElement("div");
    div.style.marginBottom = "30px";

    if (sermon.type === "video") {
      div.innerHTML = `
        <h3>${sermon.title}</h3>
        <video controls width="100%">
          <source src="${sermon.url}">
        </video>
      `;
    } else {
      div.innerHTML = `
        <h3>${sermon.title}</h3>
        <audio controls style="width:100%">
          <source src="${sermon.url}">
        </audio>
      `;
    }

    sermonList.appendChild(div);
  });
}


const toggle = document.querySelector('.menu-toggle');
const navLinks = document.querySelector('.nav-links');

toggle.addEventListener('click', () => {
  navLinks.classList.toggle('show');
});
</script>
</body>
</html>
