<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Upload Sermons</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="admin.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');

:root {
  --primary: #0a2a66;
  --light: #f4f6fa;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  background: var(--light);
}

/* LAYOUT */
.admin-container {
  display: flex;
  min-height: 100vh;
}

/* SIDEBAR */
.sidebar {
  width: 230px;
  background: var(--primary);
  color: white;
  padding: 20px;
}

.sidebar h2 {
  text-align: center;
  margin-bottom: 30px;
}

.sidebar a {
  display: block;
  color: white;
  text-decoration: none;
  margin: 15px 0;
  font-weight: 500;
}

.sidebar a:hover {
  text-decoration: underline;
}

/* CONTENT */
.content {
  flex: 1;
  padding: 30px;
}

.card {
  background: white;
  padding: 20px;
  border-radius: 8px;
  margin-bottom: 20px;
}

button {
  background: var(--primary);
  color: white;
  padding: 10px 20px;
  border: none;
  border-radius: 5px;
  cursor: pointer;
}

/* RESPONSIVE */
@media (max-width: 768px) {
  .admin-container {
    flex-direction: column;
  }

  .sidebar {
    width: 100%;
    text-align: center;
  }
}

</style>
</head>

<body>

<script>
if (localStorage.getItem("adminLoggedIn") !== "true") {
  window.location.href = "admin-login.html";
}
</script>

<div class="admin-container">

  <div class="sidebar">
    <h2>Dunamis Admin</h2>
    <a href="admin-dashboard.html">🏠 Dashboard</a>
    <a href="admin-leadership.html">👤 Leadership</a>
    <a href="admin-sermons.html">🎤 Sermons</a>
    <a href="#" onclick="logout()">🚪 Logout</a>
  </div>

  <div class="content">
    <h1>Upload Sermon</h1>

    <div class="card">
      <form id="uploadForm">
        <input type="text" id="title" placeholder="Sermon Title" required><br><br>

        <select id="type">
          <option value="video">Video</option>
          <option value="audio">Audio</option>
        </select><br><br>

        <input type="file" id="file" required><br><br>

        <button type="submit">Upload</button>
      </form>
    </div>
  </div>

</div>

<script>
let sermons = JSON.parse(localStorage.getItem("sermons")) || [];

document.getElementById("uploadForm").addEventListener("submit", function(e){
  e.preventDefault();

  const title = title.value;
  const type = document.getElementById("type").value;
  const file = document.getElementById("file").files[0];

  const url = URL.createObjectURL(file);
  sermons.push({ title, type, url });

  localStorage.setItem("sermons", JSON.stringify(sermons));
  alert("Sermon uploaded!");
  this.reset();
});

function logout() {
  localStorage.removeItem("adminLoggedIn");
  window.location.href = "admin-login.html";
}
</script>

</body>
</html>
