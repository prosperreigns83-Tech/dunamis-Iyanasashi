<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Dunamis Church</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');

:root {
  --primary: #0a2a66;
  --secondary: #ffffff;
  --accent: #4da3ff;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}



body {
  background: var(--secondary);
  color: #222;
  line-height: 1.6;
}

/* NAVBAR */
header {
  background: var(--primary);
  padding: 15px 40px;
  position: sticky;
  top: 0;
  z-index: 1000;
}

.navbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  color: white;
  font-size: 24px;
  font-weight: 700;
}

.nav-links {
  display: flex;
  gap: 25px;
}

.nav-links a {
  color: white;
  text-decoration: none;
  font-weight: 500;
}

.menu-toggle {
  display: none;
  font-size: 26px;
  color: white;
  cursor: pointer;
}

/* HERO */
.hero {
  background: linear-gradient(rgba(10,42,102,0.8), rgba(10,42,102,0.8)),
              url('https://images.unsplash.com/photo-1529070538774-1843cb3265df') center/cover;
  color: white;
  padding: 120px 20px;
  text-align: center;
}

.hero h1 {
  font-size: 48px;
}

.hero p {
  margin: 15px 0;
  font-size: 18px;
}

.btn {
  background: var(--accent);
  color: white;
  padding: 12px 30px;
  border-radius: 5px;
  text-decoration: none;
  display: inline-block;
  margin-top: 20px;
}

/* SECTIONS */
section {
  padding: 60px 40px;
  max-width: 1100px;
  margin: auto;
}

section h2 {
  color: var(--primary);
  margin-bottom: 20px;
  text-align: center;
}

/* FOOTER */
footer {
  background: var(--primary);
  color: white;
  text-align: center;
  padding: 20px;
  margin-top: 50px;
}

/* RESPONSIVE */
@media (max-width: 768px) {
  .nav-links {
    display: none;
    flex-direction: column;
    background: var(--primary);
    position: absolute;
    top: 65px;
    right: 0;
    width: 100%;
    padding: 20px;
  }

  .nav-links.show {
    display: flex;
  }

  .menu-toggle {
    display: block;
  }

  .hero h1 {
    font-size: 34px;
  }
}
/* ===== WHATSAPP BUTTON ===== */
.whatsapp-btn {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: #25D366;
  color: #ffffff;
  padding: 14px 16px;
  border-radius: 50%;
  font-size: 22px;
  text-decoration: none;
  box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  z-index: 2000;
}

.whatsapp-btn:hover {
  background: #1ebe5d;
}
  </style>
</head>
<body>

<header>
  <div class="navbar">
    <div class="logo">Dunamis</div>
    <div class="menu-toggle">☰</div>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="leadership.html">Leadership</a>
      <a href="services.html">Services</a>
      <a href="sermons.html">Sermons</a>
      <a href="give.html">Give</a>
      <a href="contact.html">Contact</a>
    </nav>
  </div>
</header>

<section>
  <h2>Contact Us</h2>
  <p>
    📍 Location: Iyanosashi<br>
    ☎ Phone: +234 XXX XXX XXXX<br>
    📧 Email: info@dunamischurch.org
  </p>

  <p>
    You are always welcome to worship with us.
  </p>
</section>
<a
  href="https://wa.me/234XXXXXXXXXX"
  class="whatsapp-btn"
  target="_blank"
  aria-label="Chat with us on WhatsApp"
>
  💬
  
</a>
<footer>
  <p>© 2025 Dunamis Church, Iyanosashi</p>
</footer>
</body>
<script>
  const toggle = document.querySelector('.menu-toggle');
const navLinks = document.querySelector('.nav-links');

toggle.addEventListener('click', () => {
  navLinks.classList.toggle('show');
});

</script>
</html>
