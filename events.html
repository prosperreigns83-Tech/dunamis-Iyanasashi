<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Church Programs | Dunamis Church</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/style.css">
<style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');

:root {
  --primary: #0a2a66;
  --secondary: #ffffff;
  --accent: #4da3ff;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}



body {
  background: var(--secondary);
  color: #222;
  line-height: 1.6;
}

/* NAVBAR */
header {
  background: var(--primary);
  padding: 15px 40px;
  position: sticky;
  top: 0;
  z-index: 1000;
}

.navbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  color: white;
  font-size: 24px;
  font-weight: 700;
}

.nav-links {
  display: flex;
  gap: 25px;
}

.nav-links a {
  color: white;
  text-decoration: none;
  font-weight: 500;
}

.menu-toggle {
  display: none;
  font-size: 26px;
  color: white;
  cursor: pointer;
}

/* HERO */
.hero {
  background: linear-gradient(rgba(10,42,102,0.8), rgba(10,42,102,0.8)),
              url('https://images.unsplash.com/photo-1529070538774-1843cb3265df') center/cover;
  color: white;
  padding: 120px 20px;
  text-align: center;
}

.hero h1 {
  font-size: 48px;
}

.hero p {
  margin: 15px 0;
  font-size: 18px;
}

.btn {
  background: var(--accent);
  color: white;
  padding: 12px 30px;
  border-radius: 5px;
  text-decoration: none;
  display: inline-block;
  margin-top: 20px;
}

/* SECTIONS */
section {
  padding: 60px 40px;
  max-width: 1100px;
  margin: auto;
}

section h2 {
  color: var(--primary);
  margin-bottom: 20px;
  text-align: center;
}

/* FOOTER */
footer {
  background: var(--primary);
  color: white;
  text-align: center;
  padding: 20px;
  margin-top: 50px;
}

/* RESPONSIVE */
@media (max-width: 768px) {
  .nav-links {
    display: none;
    flex-direction: column;
    background: var(--primary);
    position: absolute;
    top: 65px;
    right: 0;
    width: 100%;
    padding: 20px;
  }

  .nav-links.show {
    display: flex;
  }

  .menu-toggle {
    display: block;
  }

  .hero h1 {
    font-size: 34px;
  }
}

</style>
</head>

<body>

<header>
     <div class="navbar">
    <div class="logo">Dunamis Iyanasashi</div>
    <div class="menu-toggle">☰</div>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="leadership.html">Leadership</a>
      <a href="services.html">Services</a>
      <a href="sermons.html">Sermons</a>
      <a href="give.html">Give</a>
      <a href="contact.html">Contact</a>
    </nav>
  </div>
</header>

<section>
  <h2>Upcoming/Recent Church Programs</h2>
  <div id="eventsList"></div>
</section>

<footer>
  <p>© 2025 Dunamis Church, Iyanasashi</p>
</footer>

<script>
const events = JSON.parse(localStorage.getItem("events")) || [];
const eventsList = document.getElementById("eventsList");

if (events.length === 0) {
  eventsList.innerHTML = "<p>No programs posted yet.</p>";
}

events.forEach(event => {
  const div = document.createElement("div");
  div.style.marginBottom = "30px";

  div.innerHTML = `
    <img src="${event.imageUrl}" style="width:100%;max-height:250px;object-fit:cover;border-radius:8px;">
    <h3>${event.title}</h3>
    <p><strong>Date:</strong> ${event.date}</p>
    <p>${event.description}</p>
  `;

  eventsList.appendChild(div);
});

    const toggle = document.querySelector('.menu-toggle');
const navLinks = document.querySelector('.nav-links');

toggle.addEventListener('click', () => {
  navLinks.classList.toggle('show');
});

</script>

</body>
</html>
